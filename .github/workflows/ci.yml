name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q scripts tests
      - name: Validate storyboards
        run: |
          python scripts/validate_storyboard.py --storyboard templates/storyboard.json
          python scripts/director_plan.py --director templates/director-plan.json --storyboard templates/storyboard.json
          python scripts/validate_storyboard.py --storyboard examples/compound-interest/storyboard.json
          python scripts/validate_storyboard.py --storyboard examples/focus-interruption/storyboard.json
          python scripts/audit_script.py --script examples/focus-interruption/script.json --storyboard examples/focus-interruption/storyboard.json
          python scripts/director_plan.py --director examples/focus-interruption/director-plan.json --storyboard examples/focus-interruption/storyboard.json
      - name: Unit and pipeline tests
        run: python -m unittest discover -s tests -v
